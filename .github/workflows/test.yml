name: Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  test-lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          set +e
          pytest tests/ -v --tb=short --cov=. --cov-report=xml 2>&1 | tee pytest_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "pytest exited with $EXIT_CODE"
            tail -100 pytest_output.txt
            exit $EXIT_CODE
          fi

      - name: Upload pytest output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-lite
          path: pytest_output.txt

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 | Tee-Object -FilePath pytest_output.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content pytest_output.txt -Tail 100
            exit $LASTEXITCODE
          }

      - name: Upload pytest output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-windows
          path: pytest_output.txt

  js-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run lint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lint tools
        run: |
          # black pinned to the version validated locally (formatting rules change between releases)
          pip install flake8 black==26.5.1 mypy

      - name: Check code style (Black)
        run: |
          set +e
          black --check --diff . 2>&1 | tee black_diff.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            head -80 black_diff.txt
            exit $EXIT_CODE
          fi

      - name: Upload black diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: black-diff
          path: black_diff.txt

      - name: Run flake8
        run: |
          # F401/F541/F841/E402 are noisy in tests/scripts (unused imports,
          # placeholder-less f-strings, intentional late imports); keep the
          # structural checks (E501 long lines, W293, E7xx) enforced.
          flake8 . --max-line-length=120 --extend-ignore=E203,W503,F401,F541,F841,E402,E722,E741

      - name: Run mypy
        run: |
          # sdk/ contains icon-generation scripts; not part of the core gateway
          mypy . --ignore-missing-imports --exclude sdk

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Lite Docker image
        run: |
          docker build -t ai-privacy-gateway:lite -f Dockerfile .

      - name: Test Docker container
        run: |
          docker run -d --name test-gateway -p 9999:9999 ai-privacy-gateway:lite
          for i in $(seq 1 12); do
            sleep 2
            if curl -sf http://localhost:9999/health; then
              echo "Gateway healthy after $((i * 2))s"
              break
            fi
            echo "Waiting for gateway... ($((i * 2))s)"
          done
          curl -f http://localhost:9999/health || (docker logs test-gateway && exit 1)
          docker stop test-gateway

  security-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security scanning tools
        run: |
          pip install pip-audit bandit

      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          # Audit the project's declared dependencies, not the runner's
          # pre-installed environment (which contains unrelated packages)
          pip-audit -r requirements.txt

      - name: Run bandit (SAST)
        run: |
          bandit -r . --exclude ./tests,./website-astro,./sdk --level medium
